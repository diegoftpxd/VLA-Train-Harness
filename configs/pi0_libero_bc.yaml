# Learner π0 (BC) para la prueba E2E de dos procesos sobre LIBERO (formato `local`).
# Ver docs/dataset/Pi0 E2E Plan.md. Igual que configs/pi0_pusht_bc.yaml, con las dos
# cámaras de LIBERO que sirve configs/core/pi0_libero.yaml.
#
#   uv run vla-core   --config configs/core/pi0_libero.yaml   # terminal 1 (CPU, sin extra)
#   uv run --extra pi0 vla-learner --config configs/pi0_libero_bc.yaml  # terminal 2 (GPU)
#
# Carga los pesos reales de π0 (~7 GB bf16): NO cabe en la RTX 2050; va al cluster.
seed: 0

device: cuda

# Core real por ZeroMQ (el sbatch reescribe la dirección por un socket ipc:// del job).
core: {type: zmq, address: "tcp://localhost:5555", timeout_s: 60}

policy:
  type: pi0
  pretrained: lerobot/pi0_base
  # Deben coincidir EXACTO con las cámaras que sirve el dataset: vista general y
  # muñeca de LIBERO. La tercera que espera pi0_base la rellena y enmascara el modelo.
  cameras: [observation.images.base_0_rgb, observation.images.left_wrist_0_rgb]
  image_size: 224
  torch_dtype: bfloat16
  # Fine-tuning parcial: solo el action expert; PaliGemma congelado (menos memoria).
  freeze: {trainable: [action]}
  # Tokenizer de la instrucción (repo de HF con acceso restringido; ver slurm/README.md).
  tokenizer: google/paligemma-3b-pt-224
  # Estado (8 dims) y acción (7 dims) de LIBERO en unidades reales; pi0_base no trae
  # estadísticas de LIBERO: se calculan al arrancar con una muestra pedida a Core.
  normalizer: {mode: mean_std, stats: fit, fit_samples: 256}

# π0 es flow matching (sin log-prob): sirve para BC, no para PPO/GRPO.
algorithm: {type: bc}

# Demos supervisadas desde el Core. batch_size chico por memoria (pi0 es grande).
data: {type: supervised, batch_size: 2}

optimizer: {name: adamw, lr: 0.00005, grad_clip: 1.0, scheduler: null, precision: bf16}

checkpoint: {directory: checkpoints/pi0_libero_bc, every: 200, keep_last: 2}

# El embodiment debe tener las cámaras que el procesador de π0 requiere.
available_cameras: [observation.images.base_0_rgb, observation.images.left_wrist_0_rgb]

# Prueba de humo: pocos pasos, no se busca converger.
num_iterations: 10
