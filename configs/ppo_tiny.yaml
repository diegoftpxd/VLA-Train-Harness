# Configuración tiny de ejemplo: PPO en el ambiente (ToyReach) del FakeCoreClient.
# uv run vla-learner --config configs/ppo_tiny.yaml
seed: 0

core: {type: fake, seed: 0}

policy:
  type: composed
  action_dim: 2
  chunk_size: 1
  feature_dim: 16
  backbone: {type: tiny, seq_len: 1}
  action_head: {type: gaussian}
  processor: {type: simple, cameras: [front]}
  normalizer: {mode: mean_std}
  value_head: {hidden_dim: 16}

algorithm:
  type: ppo
  clip_ratio: 0.2
  update_epochs: 2
  minibatch_size: 32
  advantage: {type: gae, gamma: 0.99, lam: 0.95}

data: {type: env_rollout, env_ids: [sim-0, sim-1], steps_per_batch: 16}

optimizer: {name: adamw, lr: 0.0003, grad_clip: 1.0, scheduler: null, precision: fp32}

checkpoint: {directory: checkpoints/ppo_tiny, every: 50, keep_last: 2}

num_iterations: 5
