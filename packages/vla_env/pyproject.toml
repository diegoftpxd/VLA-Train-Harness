[project]
name = "vla-env"
version = "0.1.0"
description = "Procesos Environment del harness VLA: adaptadores de simuladores y robots, servidos por ZeroMQ."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
    "vla-common",
]

[project.scripts]
vla-env = "vla_env.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_env"]

[tool.uv.sources]
vla-common = { workspace = true }
