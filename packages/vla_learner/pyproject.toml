[project]
name = "vla-learner"
version = "0.1.0"
description = "Proceso Learner del harness VLA: inferencia y entrenamiento del modelo."
requires-python = ">=3.12"
dependencies = [
    "vla-common",
    "torch>=2.5",
    "pyzmq>=27.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vla-learner = "vla_learner.cli:main"

[project.optional-dependencies]
openvla = [
    "accelerate>=0.25",
    "pillow>=10.0",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "transformers==4.40.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_learner"]

[tool.uv.sources]
vla-common = { workspace = true }
