[project]
name = "vla-learner"
version = "0.1.0"
description = "Proceso Learner del harness VLA: inferencia y entrenamiento del modelo."
requires-python = ">=3.12"
dependencies = [
    "vla-common",
    "torch>=2.5",
    "pyzmq>=27.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vla-learner = "vla_learner.cli:main"

[project.optional-dependencies]
openvla = [
    "accelerate>=0.25",
    "pillow>=10.0",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "transformers==4.40.1",
]
pi0 = [
    "lerobot>=0.4.4",
    # π0 (PaliGemma) necesita un transformers moderno. openvla fija 4.40.1, que es
    # demasiado viejo (no registra "paligemma" en CONFIG_MAPPING de transformers).
    # El tope <4.52 evita el mismatch de pesos de PI0 (lerobot#1406); 4.51.3 es la
    # versión reportada como buena. Como choca con el pin de openvla, ambos extras
    # se declaran en conflicto en [tool.uv]: se instala uno U otro, no los dos.
    "transformers>=4.48,<4.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_learner"]

# openvla (transformers==4.40.1) y pi0 (transformers>=4.48,<4.52) piden versiones
# incompatibles de transformers: no pueden convivir en el mismo entorno. Se
# declaran como extras en conflicto para que uv resuelva cada uno por separado
# (instalás uno u otro con `uv sync --extra openvla` o `--extra pi0`).
[tool.uv]
conflicts = [
    [{ extra = "openvla" }, { extra = "pi0" }],
]

[tool.uv.sources]
vla-common = { workspace = true }
