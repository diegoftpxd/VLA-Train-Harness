[project]
name = "vla-learner"
version = "0.1.0"
description = "Proceso Learner del harness VLA: inferencia y entrenamiento del modelo."
requires-python = ">=3.12"
dependencies = [
    "vla-common",
    "torch>=2.5",
    "pyzmq>=27.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vla-learner = "vla_learner.cli:main"

[project.optional-dependencies]
openvla = [
    "accelerate>=0.25",
    "pillow>=10.0",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "transformers==4.40.1",
]
pi0 = [
    "lerobot>=0.4.4",
    # π0 de LeRobot NO funciona con un transformers de PyPI: su chequeo interno de
    # versión (modeling_pi0.py) exige el transformers PARCHEADO de la rama de git
    # fix/lerobot_openpi. El wheel de PyPI de lerobot 0.4.4 no expone el extra `pi`
    # que lo declara, así que replicamos acá sus dos dependencias (el transformers
    # de git y scipy). Ese transformers choca con el pin de openvla (==4.40.1), así
    # que openvla y pi0 se declaran como extras en conflicto en [tool.uv].
    "transformers @ git+https://github.com/huggingface/transformers.git@fix/lerobot_openpi",
    "scipy>=1.10.1,<1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_learner"]

[tool.hatch.metadata]
# Permite dependencias por referencia directa: el transformers parcheado de git
# del extra `pi0` (ver [project.optional-dependencies]).
allow-direct-references = true

# openvla (transformers==4.40.1) y pi0 (transformers>=4.48,<4.52) piden versiones
# incompatibles de transformers: no pueden convivir en el mismo entorno. Se
# declaran como extras en conflicto para que uv resuelva cada uno por separado
# (instalás uno u otro con `uv sync --extra openvla` o `--extra pi0`).
[tool.uv]
conflicts = [
    [{ extra = "openvla" }, { extra = "pi0" }],
]

[tool.uv.sources]
vla-common = { workspace = true }
