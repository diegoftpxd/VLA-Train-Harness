[project]
name = "vla-learner"
version = "0.1.0"
description = "Proceso Learner del harness VLA: inferencia y entrenamiento del modelo."
requires-python = ">=3.12"
dependencies = [
    "vla-common",
    "torch>=2.5",
]

[project.scripts]
vla-learner = "vla_learner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_learner"]

[tool.uv.sources]
vla-common = { workspace = true }
