[project]
name = "vla-core"
version = "0.1.0"
description = "Proceso Core del harness VLA: gateway entre el Learner y los componentes."
requires-python = ">=3.12"
dependencies = [
    "vla-common",
    "pyzmq>=27.2.0",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vla-core = "vla_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_core"]

[tool.uv.sources]
vla-common = { workspace = true }
